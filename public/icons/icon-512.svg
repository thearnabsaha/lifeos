<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Aesthetic Warm Nude Peach-Pink Gradient -->
    <linearGradient id="clock-nude-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEDE8"/>
      <stop offset="60%" stop-color="#F8E3DC"/>
      <stop offset="100%" stop-color="#F3D9D1"/>
    </linearGradient>
  </defs>

  <!-- iOS Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#clock-nude-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ECCBC2" stroke-width="2.5" opacity="0.7"/>

  <!-- Minimalist Normal Clock Line Art -->
  <g fill="none" stroke="#463937" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clock Outer Dial Circle -->
    <circle cx="256" cy="256" r="150" />

    <!-- 12, 3, 6, 9 Hour Ticks -->
    <line x1="256" y1="124" x2="256" y2="146" />
    <line x1="388" y1="256" x2="366" y2="256" />
    <line x1="256" y1="388" x2="256" y2="366" />
    <line x1="124" y1="256" x2="146" y2="256" />

    <!-- Hour Hand (Pointing to 10) -->
    <line x1="256" y1="256" x2="182" y2="182" stroke-width="18" />

    <!-- Minute Hand (Pointing to 2) -->
    <line x1="256" y1="256" x2="330" y2="182" stroke-width="15" />

    <!-- Center Pivot Dot -->
    <circle cx="256" cy="256" r="6" fill="#463937" stroke-width="8" />
  </g>
</svg>
