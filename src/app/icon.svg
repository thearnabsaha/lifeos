<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="fav-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="fav-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="fav-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#fav-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="url(#fav-stroke)" stroke-width="1"/>

  <!-- Dial Orbit Arc -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="48 16" transform="rotate(-45 16 16)"/>
  
  <!-- Active Node -->
  <circle cx="23.5" cy="8.5" r="1.5" fill="#38bdf8"/>

  <!-- Bold L Monogram -->
  <path d="M 10.5 8.5
           C 10.5 7.7, 11.2 7, 12 7
           C 12.8 7, 13.5 7.7, 13.5 8.5
           L 13.5 20.5
           C 13.5 21.3, 14.2 22, 15 22
           L 21.5 22
           C 22.3 22, 23 22.7, 23 23.5
           C 23 24.3, 22.3 25, 21.5 25
           L 13.5 25
           C 11.8 25, 10.5 23.7, 10.5 22
           Z"
        fill="url(#fav-brand)"/>

  <!-- Inner Spark -->
  <polygon points="21,11 22.5,12.5 21,14 19.5,12.5" fill="#38bdf8"/>
  <polygon points="21,11.5 22,12.5 21,13.5 20,12.5" fill="#ffffff"/>
</svg>
